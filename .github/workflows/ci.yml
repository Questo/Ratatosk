name: CI

on:
  # main is not path-filtered so every merge reaches the release job
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '**/*.cs'
      - '**/*.csproj'
      - 'Directory.Packages.props'
      - 'dotnet-tools.json'
      - 'package.json'
      - 'package-lock.json'
      - '.releaserc.json'
      - '.github/**'
  # Started by dependabot-auto-merge, whose GITHUB_TOKEN merges don't trigger push
  workflow_dispatch:

# Superseded PR runs are cancelled; main runs queue so a release is never cut short
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (includes tests + coverage)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          tags: ratatosk-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Copy coverage report from container
        uses: ./.github/actions/copy-container-coverage
        with:
          container-tag: ratatosk-api:test
          target-path: coverage

      - name: Set up .NET SDK
        uses: ./.github/actions/setup-dotnet-cache

      - name: Generate coverage report and enforce threshold
        run: ./scripts/coverage-report.sh coverage coverage-report

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: coverage-report

      - name: Publish unit test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Unit Tests
          path: coverage/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ratatosk_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: ./.github/actions/setup-dotnet-cache

      - name: Run integration tests
        run: dotnet test tests/IntegrationTests --configuration Release --verbosity normal

  check-formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: ./.github/actions/setup-dotnet-cache

      - name: Verify formatting
        run: dotnet format --verify-no-changes --severity error --verbosity detailed

  # Only main builds reach the registry, and only once every check has passed.
  # Rebuilt from build-and-test's layer cache, so the tests are not run again.
  push-image:
    needs: [build-and-test, integration-tests, check-formatting]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set lowercase image name
        uses: ./.github/actions/setup-image-metadata

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Push image to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          provenance: false
          sbom: false

  release:
    needs: [push-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      new-version: ${{ steps.semantic.outputs.new-version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install semantic-release
        run: npm ci

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          npx semantic-release
          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$AFTER" != "$BEFORE" ] && [ "$AFTER" != "none" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "new-version=${AFTER#v}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set lowercase image name
        uses: ./.github/actions/setup-image-metadata

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Retag the image built from this exact commit, never the moving ci tag
      - name: Tag and push versioned images
        env:
          VERSION: ${{ needs.release.outputs.new-version }}
          SOURCE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          docker pull "$SOURCE"
          docker tag "$SOURCE" "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:$VERSION"
          docker tag "$SOURCE" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"
