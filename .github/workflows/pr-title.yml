name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - name: Validate conventional commit format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            ci
            chore
            style
          requireScope: false
          # docs/COMMITS.md: description is lowercase with no trailing period
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The description "{subject}" must start lowercase and not end with a period (see docs/COMMITS.md).
          # Dependabot capitalises "Bump"; dependabot-auto-merge lowercases it when merging
          ignoreLabels: |
            dependencies
