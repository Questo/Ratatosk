name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge minor and patch Dependabot updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          author=$(gh pr view "$PR_NUMBER" --json author --jq .author.login)
          if [ "$author" != "app/dependabot" ]; then
            echo "PR #$PR_NUMBER is by $author, not Dependabot; skipping."
            exit 0
          fi

          # Dependabot records the update type of every bumped package in its commit message
          if gh pr view "$PR_NUMBER" --json commits --jq '.commits[].messageBody' | grep -q 'version-update:semver-major'; then
            echo "PR #$PR_NUMBER contains a major version bump; leaving it for manual review."
            exit 0
          fi

          # Only merge the exact commit CI passed on, in case Dependabot pushed again since
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA"
