name: "Set up .NET SDK with NuGet cache"
description: "Installs the .NET SDK and restores/caches the NuGet package cache"
runs:
  using: "composite"
  steps:
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    # Package versions live in Directory.Packages.props, local tools in dotnet-tools.json
    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'dotnet-tools.json') }}
        restore-keys: nuget-${{ runner.os }}-
