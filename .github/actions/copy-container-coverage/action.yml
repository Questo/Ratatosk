name: "Copy Container Coverage"
description: "Copies the /coverage folder out of a built image"
inputs:
  container-tag:
    required: true
    description: "Image tag to create a throwaway container from"
  target-path:
    required: true
    description: "Directory in host to copy coverage to"
runs:
  using: "composite"
  steps:
    - run: |
        mkdir -p "$TARGET_PATH"
        container_id=$(docker create "$CONTAINER_TAG")
        docker cp "$container_id:/coverage" "$TARGET_PATH"
        docker rm "$container_id"
      shell: bash
      env:
        CONTAINER_TAG: ${{ inputs.container-tag }}
        TARGET_PATH: ${{ inputs.target-path }}
