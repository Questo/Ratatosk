version: 2
updates:
  # Also covers the local tools in dotnet-tools.json
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
        update-types: ["minor", "patch"]
      test-tooling:
        patterns:
          - "MSTest"
          - "Moq"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
        update-types: ["minor", "patch"]
      everything-else:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # Release tooling (semantic-release) pinned in package.json
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      release-tooling:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # Workflows plus the composite actions they use
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
