server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The trailing slash on proxy_pass strips the /api prefix: /api/auth/me -> /auth/me
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The change stream (Server-Sent Events): unbuffered so each event reaches the browser at once,
    # and a long read timeout so an idle stream isn't closed after nginx's default 60 s
    location /api/changes {
        proxy_pass http://api:8080/changes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
